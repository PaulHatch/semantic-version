name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "feature/*"

jobs:
  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Format check
        run: npm run format-check

      - name: Test
        run: npm test

      - name: Package
        run: npm run package

      - name: Run Action
        uses: ./
        id: run
        with:
          debug: true

      - name: Print version
        run: echo "Version ${{ steps.run.outputs.version }}"
        env:
          DEBUG_OUTPUT: ${{ steps.run.outputs.debug_output }}

  version:
    name: Version
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Get version
        uses: ./
        id: version

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  release:
    name: Publish Release v${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MAJOR: ${{ needs.version.outputs.major }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Update package.json version
        run: npm version "$VERSION" --no-git-tag-version

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create and push tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git tag -fa "v$MAJOR" -m "Update v$MAJOR to $VERSION"
          git push origin "v$VERSION"
          git push origin "v$MAJOR" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## Installation

            ### GitHub Action
            ```yaml
            - uses: paulhatch/semantic-version@v${{ needs.version.outputs.major }}
            ```

            ### CLI
            ```bash
            npm install -g @semanticversion/cli
            ```
